name: Portable WISDOM

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }} / Python 3.12.10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Install test dependency
        run: python -m pip install pytest==9.1.1
      - name: Portable tests
        run: python -m pytest
      - name: Check deterministic archive
        run: python scripts/build_wisdom_bundle.py --check
