name: Portable WISDOM

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ["3.12.10", "3.14.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest==9.1.1
      - name: Portable tests
        run: python -m pytest -rs
      - name: Check deterministic archive
        run: python scripts/build_wisdom_bundle.py --check
      - name: Check technology rule report
        run: python scripts/report_technology_modules.py --check

  release:
    name: Publish versioned archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
      - name: Verify version and prepare release notes
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          version = Path("VERSION").read_text().strip()
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != f"v{version}":
              raise SystemExit("Tag must match the exact product VERSION")
          changelog = Path("CHANGELOG.md").read_text()
          heading = f"## {version} - "
          if changelog.count(heading) != 1:
              raise SystemExit("Expected exactly one versioned changelog entry")
          entry = changelog.split(heading, 1)[1].split("\n", 1)[1].split("\n## ", 1)[0].strip()
          notes = f"{entry}\n\nThe attached reed-wisdom.zip is the deterministic portable archive.\n"
          notes += "\nRelease evidence: contract-complete, empirical-drills-open. Delivery checks do not establish improved model behavior.\n"
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes + "\n")
      - name: Verify release inputs and CLI
        run: |
          python scripts/build_wisdom_bundle.py --check
          python scripts/report_technology_modules.py --check
          gh release create --help > /dev/null
          gh release edit --help > /dev/null
          cp WISDOM.zip "$RUNNER_TEMP/reed-wisdom.zip"
      - name: Upload archive and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/reed-wisdom.zip" --verify-tag --draft --title "WISDOM $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
